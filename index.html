<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Frengee Quote Builder</title>
<style>
:root{--bg:#eef1f7;--card:#ffffff;--fg:#141a3a;--muted:#5d6680;--line:#dde3ee;--field:#f6f8fc;--accent:#0173fe;--accent-ink:#ffffff;--err:#b4192f;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#090c1f;--card:#11162f;--fg:#e7ebf7;--muted:#9aa3c2;--line:#252c4f;--field:#0c1029;--accent:#4d98ff;--accent-ink:#06102b;--err:#ff9aaa;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Aptos","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.logo{display:inline-block;background:#fff;border-radius:8px;padding:6px 10px;align-self:flex-start}
.logo img{height:26px;display:block}
h1{margin:4px 0 0;font-size:19px}
p{margin:0;color:var(--muted);font-size:13.5px}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=password]{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 11px}
.remember{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--fg)}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--err);font-size:13px;min-height:1.2em}
</style>
</head>

const K="frengee-quote-key";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function show(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.data));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function fromPassword(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
  if(location.hash==="#lock"){try{localStorage.removeItem(K);}catch(e){}history.replaceState(null,"",location.pathname);return;}
  let saved=null;try{saved=localStorage.getItem(K);}catch(e){}
  if(!saved)return;
  try{await show(await crypto.subtle.importKey("raw",b64(saved),"AES-GCM",false,["decrypt"]));}
  catch(e){try{localStorage.removeItem(K);}catch(_){}}
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const go=document.getElementById("go"),err=document.getElementById("err");
  if(!window.crypto||!crypto.subtle){err.textContent="This page needs a secure (https) connection to unlock.";return;}
  go.disabled=true;go.textContent="Unlocking\u2026";err.textContent="";
  try{
    const key=await fromPassword(document.getElementById("pw").value);
    if(document.getElementById("rem").checked){
      try{const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));localStorage.setItem(K,btoa(String.fromCharCode(...raw)));}catch(_){}
    }
    await show(key);
  }catch(x){
    try{localStorage.removeItem(K);}catch(_){}
    err.textContent="That password isn\u2019t right. Try again.";go.disabled=false;go.textContent="Unlock";
    document.getElementById("pw").select();
  }
});
</script>
